name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Syntax check
        run: python -m compileall -q ulearning tools tests

      - name: CLI smoke
        run: |
          python -m ulearning --version
          python -m ulearning run --help

      - name: Detector self-test (bundled chromium)
        env:
          ULEARN_CHANNEL: chromium
        run: python tests/test_detector.py
